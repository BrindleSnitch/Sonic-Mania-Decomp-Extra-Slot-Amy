name: Build Addendum as Mod

on:
  workflow_dispatch:
    inputs:
      retro_revision:
        description: "3 = v5U/Origins, 2 = v5/Steam"
        default: "3"

jobs:
  addendum-mod:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout RSDKv5 engine
        uses: actions/checkout@v4
        with:
          repository: "RSDKModding/RSDKv5-Decompilation"
          submodules: recursive

      - name: Checkout stock Sonic Mania (game logic)
        uses: actions/checkout@v4
        with:
          repository: "RSDKModding/Sonic-Mania-Decompilation"
          path: "Sonic-Mania-Decompilation"

      - name: Checkout Addendum (mod logic)
        uses: actions/checkout@v4
        with:
          repository: "KiaraGale/Sonic-Mania-Addendum"
          path: "Sonic-Mania-Addendum"

      - name: Checkout Example-Mods
        uses: actions/checkout@v4
        with:
          repository: "RSDKModding/RSDKv5-Example-Mods"
          path: "RSDKv5-Example-Mods"

      - name: Checkout GameAPI
        uses: actions/checkout@v4
        with:
          repository: "RSDKModding/RSDKv5-GameAPI"
          path: "RSDKv5-GameAPI"

      - name: Setup RSDKv5 dependencies
        working-directory: ./dependencies/android
        run: |
          curl -L -O https://downloads.xiph.org/releases/ogg/libogg-1.3.5.zip
          curl -L -O https://downloads.xiph.org/releases/theora/libtheora-1.1.1.zip
          unzip \*.zip
          rm *.zip
          rsync -ar libogg-*/* libogg
          mv libtheora-* libtheora

      - name: Wire Addendum up as a mod module
        run: |
          rm -rf Game
          rm -rf "$PWD/Sonic-Mania-Decompilation/dependencies/RSDKv5"
          ln -s "$PWD" "$PWD/Sonic-Mania-Decompilation/dependencies/RSDKv5"
          # Addendum builds as a mod via CMakeListsA.txt -> libAddendum.so
          cp "$PWD/Sonic-Mania-Addendum/CMakeListsA.txt" "$PWD/Sonic-Mania-Addendum/CMakeLists.txt"
          ln -s "$PWD/RSDKv5-GameAPI" "$PWD/Sonic-Mania-Addendum/GameAPI" || true
          ln -s "$PWD/RSDKv5-GameAPI" RSDKv5-Example-Mods/ManiaTouchControls/GameAPI
          ln -s "$PWD/RSDKv5-GameAPI" RSDKv5-Example-Mods/UltrawideMania/GameAPI
          ln -s "$PWD/Sonic-Mania-Decompilation" ./android/app/jni/Game
          ln -s "$PWD/Sonic-Mania-Addendum"      ./android/app/jni/ADD
          ln -s "$PWD/RSDKv5-Example-Mods/ManiaTouchControls" ./android/app/jni/MTC
          ln -s "$PWD/RSDKv5-Example-Mods/UltrawideMania"     ./android/app/jni/UWM
          echo "--- jni dir ---"; ls -la ./android/app/jni

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build
        working-directory: ./android
        run: |
          ./gradlew assemble --no-daemon \
            -PABIFILTERS="arm64-v8a" \
            -PRETRO_REVISION=${{ inputs.retro_revision }} \
            --stacktrace
          mv app/build/outputs/apk/release/*.apk addendum_mod.apk

      - name: Show built libs
        run: |
          unzip -l android/addendum_mod.apk | grep '\.so' || true

      - name: Bundle
        run: |
          mkdir -p artifacts
          cp android/*.apk artifacts/

      - name: Cleanup symlink
        if: always()
        run: rm -f "$PWD/Sonic-Mania-Decompilation/dependencies/RSDKv5"

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: addendum-mod
          path: artifacts
