name: Build Addendum Android

on:
  workflow_dispatch:
    inputs:
      disable_plus:
        description: "Pass -PRETRO_DISABLE_PLUS (parity with official APK)"
        type: boolean
        default: true
      abis:
        description: "ABIs to build"
        default: "arm64-v8a"

jobs:
  addendum-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout RSDKv5 engine
        uses: actions/checkout@v4
        with:
          repository: "RSDKModding/RSDKv5-Decompilation"
          submodules: recursive

      - name: Checkout Sonic Mania Addendum
        uses: actions/checkout@v4
        with:
          repository: "KiaraGale/Sonic-Mania-Addendum"
          path: "Sonic-Mania-Addendum"

      - name: Checkout Example-Mods
        uses: actions/checkout@v4
        with:
          repository: "RSDKModding/RSDKv5-Example-Mods"
          path: "RSDKv5-Example-Mods"

      - name: Checkout GameAPI
        uses: actions/checkout@v4
        with:
          repository: "RSDKModding/RSDKv5-GameAPI"
          path: "RSDKv5-GameAPI"

      - name: Show Addendum layout
        run: |
          echo "--- Addendum root ---"
          ls -la Sonic-Mania-Addendum
          echo "--- dependencies ---"
          ls -la Sonic-Mania-Addendum/dependencies || true

      - name: Setup RSDKv5 dependencies
        working-directory: ./dependencies/android
        run: |
          curl -L -O https://downloads.xiph.org/releases/ogg/libogg-1.3.5.zip
          curl -L -O https://downloads.xiph.org/releases/theora/libtheora-1.1.1.zip
          unzip \*.zip
          rm *.zip
          rsync -ar libogg-*/* libogg
          mv libtheora-* libtheora

      - name: Setup symlinks
        run: |
          rm -rf Game
          rm -rf "$PWD/Sonic-Mania-Addendum/dependencies/RSDKv5"
          ln -s "$PWD" "$PWD/Sonic-Mania-Addendum/dependencies/RSDKv5"
          ln -s "$PWD/RSDKv5-GameAPI" RSDKv5-Example-Mods/ManiaTouchControls/GameAPI
          ln -s "$PWD/RSDKv5-GameAPI" RSDKv5-Example-Mods/UltrawideMania/GameAPI
          ln -s "$PWD/Sonic-Mania-Addendum" ./android/app/jni/Game
          ln -s "$PWD/RSDKv5-Example-Mods/ManiaTouchControls" ./android/app/jni/MTC
          ln -s "$PWD/RSDKv5-Example-Mods/UltrawideMania" ./android/app/jni/UWM

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Addendum + RSDKv5 Android
        working-directory: ./android
        run: |
          FLAGS=""
          if [ "${{ inputs.disable_plus }}" = "true" ]; then
            FLAGS="-PRETRO_DISABLE_PLUS"
          fi
          ./gradlew assemble --no-daemon \
            -PABIFILTERS="${{ inputs.abis }}" \
            $FLAGS \
            -PRETRO_REVISION=3 \
            --stacktrace
          mv app/build/outputs/apk/release/*.apk addendum_mania.apk

      - name: Bundle APK & mods
        run: |
          mkdir -p artifacts/mods
          cp android/*.apk artifacts/
          mkdir -p artifacts/mods/MTC
          cp -r android/app/jni/MTC/build/* artifacts/mods/MTC || true
          mkdir -p artifacts/mods/UWM
          cp -r android/app/jni/UWM/build/* artifacts/mods/UWM || true
          mkdir -p artifacts/mods/GLShaders/Data/Shaders
          cp -r RSDKv5/Shaders/OGL artifacts/mods/GLShaders/Data/Shaders
          printf "Name=GLShaders\nDescription=OGLShaders\nAuthor=Ducky\nVersion=1.0.0\nTargetVersion=-1\n" > artifacts/mods/GLShaders/mod.ini

      - name: Cleanup symlink
        if: always()
        run: rm -f "$PWD/Sonic-Mania-Addendum/dependencies/RSDKv5"

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: addendum-android
          path: artifacts
