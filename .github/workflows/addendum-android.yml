name: Build Addendum Android

on:
  workflow_dispatch:
    inputs:
      disable_plus:
        description: "Pass -PRETRO_DISABLE_PLUS (parity with official APK)"
        type: boolean
        default: true
      abis:
        description: "ABIs to build"
        default: "arm64-v8a"

jobs:
  addendum-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout RSDKv5 engine
        uses: actions/checkout@v4
        with:
          repository: "RSDKModding/RSDKv5-Decompilation"
          submodules: recursive

      - name: Checkout Sonic Mania Addendum
        uses: actions/checkout@v4
        with:
          repository: "KiaraGale/Sonic-Mania-Addendum"
          path: "Sonic-Mania-Addendum"

      - name: Checkout Example-Mods
        uses: actions/checkout@v4
        with:
          repository: "RSDKModding/RSDKv5-Example-Mods"
          path: "RSDKv5-Example-Mods"

      - name: Checkout GameAPI
        uses: actions/checkout@v4
        with:
          repository: "RSDKModding/RSDKv5-GameAPI"
          path: "RSDKv5-GameAPI"

      - name: Show Addendum layout
        run: |
          echo "--- Addendum root ---"
          ls -la Sonic-Mania-Addendum
          echo "--- dependencies ---"
          ls -la Sonic-Mania-Addendum/dependencies || true

      - name: Setup RSDKv5 dependencies
        working-directory: ./dependencies/android
        run: |
          curl -L -O https://downloads.xiph.org/releases/ogg/libogg-1.3.5.zip
          curl -L -O https://downloads.xiph.org/releases/theora/libtheora-1.1.1.zip
          unzip \*.zip
          rm *.zip
          rsync -ar libogg-*/* libogg
          mv libtheora-* libtheora

      - name: Setup symlinks
        run: |
          rm -rf Game
          rm -rf "$PWD/Sonic-Mania-Addendum/dependencies/RSDKv5"
          ln -s "$PWD" "$PWD/Sonic-Mania-Addendum/dependencies/RSDKv5"
          ln -s "$PWD/RSDKv5-GameAPI" RSDKv5-Example-Mods/ManiaTouchControls/GameAPI
          ln -s "$PWD/RSDKv5-GameAPI" RSDKv5-Example-Mods/UltrawideMania/GameAPI
          ln -s "$PWD/Sonic-Mania-Addendum" ./android/app/jni/Game
          ln -s "$PWD/RSDKv5-Example-Mods/ManiaTouchControls" ./android/app/jni/MTC
          ln -s "$PWD/RSDKv5-Example-Mods/UltrawideMania" ./android/app/jni/UWM

      - name: Patch menus to prefer pre-rendered text
        working-directory: ./Sonic-Mania-Addendum/SonicMania/Objects/Menu
        run: |
          # Use the unfinished dynamic-text path ONLY for buttons that have no
          # pre-rendered artwork configured (listID/frameID both 0). Everything
          # else uses the proven pre-rendered sprites.
          sed -i 's/if (self->string\.length > 0 \&\& !self->disabled)/if (self->string.length > 0 \&\& self->listID == 0 \&\& self->frameID == 0 \&\& !self->disabled)/g' UIButton.c
          sed -i 's/if (self->string\.length > 0)/if (self->string.length > 0 \&\& self->listID == 0 \&\& self->frameID == 0)/g' UIButton.c
          # prompts keep the pre-rendered path unconditionally (verified good)
          sed -i 's/if (self->string\.length > 0)/if (0)/g' UIButtonPrompt.c
          echo "--- UIButton.c ---"
          grep -n "string\.length > 0" UIButton.c
          echo "--- UIButtonPrompt.c ---"
          grep -n "if (0)" UIButtonPrompt.c
          test "$(grep -c 'listID == 0 && self->frameID == 0' UIButton.c)" -ge 4
          # PauseMenu sets the correct sprite directly but never records listID/frameID,
          # so UIButton_Setup thinks it has no artwork. Record them.
          sed -i 's|RSDK.SetSpriteAnimation(UIWidgets->textFrames, 10, \&button->animator, true, id);|RSDK.SetSpriteAnimation(UIWidgets->textFrames, 10, \&button->animator, true, id);\n        button->listID = 10;\n        button->frameID = id;|' ../Global/PauseMenu.c
          echo "--- PauseMenu.c ---"
          grep -n -A2 "textFrames, 10, &button->animator" ../Global/PauseMenu.c
          test "$(grep -c 'button->listID = 10' ../Global/PauseMenu.c)" -eq 1
          # UIDialog does the same thing with animation 9 ("Dialog Buttons")
          sed -i 's|RSDK.SetSpriteAnimation(UIWidgets->textFrames, 9, \&button->animator, true, frame);|RSDK.SetSpriteAnimation(UIWidgets->textFrames, 9, \&button->animator, true, frame);\n        button->listID = 9;\n        button->frameID = frame;|' UIDialog.c
          echo "--- UIDialog.c ---"
          grep -n -A2 "textFrames, 9, &button->animator" UIDialog.c
          test "$(grep -c 'button->listID = 9' UIDialog.c)" -eq 1

      - name: Patch EGL shader uniform collision (GLES3)
        working-directory: ./RSDKv5/RSDK/Graphics/EGL
        run: |
          # On GLES3 ("#version 300 es") `textureSize` is a BUILT-IN FUNCTION, so the
          # shaders' `uniform vec2 textureSize;` is rejected ("redeclaring name") and
          # every screen/video shader fails to compile. LoadShader then bails, maxShaders
          # stays 0, and the engine silently falls back to the hardcoded passthrough
          # shader with shaderSupport=false -- losing filtered scaling, screen dimming,
          # and YUV decode (all FMV renders greyscale).
          # Fix: rename the uniform from the GLES3 preamble, and match the lookup site.
          sed -i 's|#define texture2D texture\\n"|#define texture2D texture\\n#define textureSize RSDK_texSize\\n"|' EGLRenderDevice.cpp
          sed -i 's|"textureSize"), 1, \&textureSize\.x|"RSDK_texSize"), 1, \&textureSize.x|' EGLRenderDevice.cpp
          echo "--- _GLVERSION3 ---"
          grep -n '_GLVERSION3 "' EGLRenderDevice.cpp
          echo "--- uniform lookup ---"
          grep -n 'RSDK_texSize"' EGLRenderDevice.cpp
          test "$(grep -c 'define textureSize RSDK_texSize' EGLRenderDevice.cpp)" -eq 1
          test "$(grep -c '"RSDK_texSize")' EGLRenderDevice.cpp)" -eq 1
          test "$(grep -c '"textureSize")' EGLRenderDevice.cpp)" -eq 0
          # _GLVERSION is a char[128]; the extended string must still fit.
          test "$(grep -o '_GLVERSION3 "[^"]*"' EGLRenderDevice.cpp | wc -c)" -lt 128

      - name: Patch Addendum Options null controls
        working-directory: ./Sonic-Mania-Addendum/SonicMania/Objects/Menu
        run: |
          # The repo's Menu scene (Data/Stages/Menu/Scene1.bin) contains UIControls
          # tagged "Addendum Options", "Gameplay Options", "Style Options" and
          # "Music Options" -- but NOT "Multiplayer Options". MainMenu_Initialize
          # therefore leaves MainMenu->multiplayerOptsControl NULL, and
          # MainMenu_YPressCB_GoToAddendumOptions calls SetToggleButtons_Multiplayer()
          # unconditionally *before* transitioning -> NULL deref the instant you press
          # Y/H on the main menu. Same deref again on the way out via
          # MainMenu_StartReturnToParentScreen(). This is why "Addendum Options" has
          # never been reachable, which is where SPINDASH / MOVESET / PEELOUT / LIFE
          # SYSTEM / SHIELD options live in this build.
          guard() { # $1=func  $2=ptr  $3=buttons needed
            sed -i "/^void $1(void)\$/,/^}\$/ s@EntityUIControl \*control         = MainMenu->$2;@&\n    if (!control || control->buttonCount < $3) return;@" AddendumToggles.c
          }
          guard AddendumToggles_SetToggleButtons_Gameplay           gameplayOptsControl    14
          guard AddendumToggles_GetTogglesFromSelection_Gameplay    gameplayOptsControl    14
          guard AddendumToggles_SetToggleButtons_Style              styleOptsControl        2
          guard AddendumToggles_GetTogglesFromSelection_Style       styleOptsControl        2
          guard AddendumToggles_SetToggleButtons_Music              musicOptsControl        2
          guard AddendumToggles_GetTogglesFromSelection_Music       musicOptsControl        2
          guard AddendumToggles_SetToggleButtons_Multiplayer        multiplayerOptsControl  1
          guard AddendumToggles_GetTogglesFromSelection_Multiplayer multiplayerOptsControl  1
          echo "--- AddendumToggles.c guards ---"
          grep -n "control->buttonCount <" AddendumToggles.c
          test "$(grep -c 'control->buttonCount <' AddendumToggles.c)" -eq 8
          # ChangeMenuSpriteStyle also assigns `control` but never derefs it -- must NOT be guarded
          test "$(sed -n '/^void AddendumToggles_ChangeMenuSpriteStyle(void)$/,/^}$/p' AddendumToggles.c | grep -c 'buttonCount')" -eq 0

          # Selecting the Multiplayer entry would hand focus to a child that does not
          # exist; only transition when the target control actually resolved.
          sed -i 's@^    if (control->buttonID == 3)$@    if (control->buttonID == 3 \&\& MainMenu->multiplayerOptsControl)@' MainMenu.c
          sed -i 's@^        UIControl_MatchMenuTag("Multiplayer Options");$@&\n    else if (control->buttonID == 3)\n        control->childHasFocus = false;@' MainMenu.c
          echo "--- MainMenu.c transition guard ---"
          sed -n '/^void MainMenu_HandleToAddendumSubMenuTransitionCB/,/^}$/p' MainMenu.c
          test "$(grep -c 'buttonID == 3 && MainMenu->multiplayerOptsControl' MainMenu.c)" -eq 1
          test "$(grep -c 'control->childHasFocus = false;' MainMenu.c)" -eq 1

      - name: Patch Secrets menu null control
        working-directory: ./Sonic-Mania-Addendum/SonicMania/Objects/Menu
        run: |
          # Same defect class as the Multiplayer control: the Menu scene ships no
          # "Secrets" UIControl, so MenuSetup->secrets stays NULL and
          # MenuSetup_OpenSecretsMenu derefs it -> crash on pressing Y/H over the
          # NO SAVE slot in the save select.
          sed -i 's@^    if (control->active == ACTIVE_ALWAYS \&\& control->buttonID == 8) {$@    if (control->active == ACTIVE_ALWAYS \&\& control->buttonID == 8 \&\& MenuSetup->secrets) {@' MenuSetup.c
          # Scope the defensive guard to OpenSecretsMenu only -- MenuSetup_GetMedalMods
          # assigns the same pointer but returns int32, where a bare `return;` is a
          # compile error.
          sed -i '/^void MenuSetup_OpenSecretsMenu(void)$/,/^}$/ s@^    EntityUIControl \*control = MenuSetup->secrets;$@&\n    if (!control) return;@' MenuSetup.c
          echo "--- MenuSetup.c ---"
          awk '/^void MenuSetup_OpenSecretsMenu/,/^}/' MenuSetup.c
          awk '/^void MenuSetup_SaveSel_YPressCB/,/^}/' MenuSetup.c
          test "$(grep -c 'buttonID == 8 && MenuSetup->secrets' MenuSetup.c)" -eq 1
          test "$(grep -c 'if (!control) return;' MenuSetup.c)" -eq 1
          test "$(sed -n '/^int32 MenuSetup_GetMedalMods(void)$/,/^}$/p' MenuSetup.c | grep -c 'if (!control) return;')" -eq 0

      - name: Patch special stage results soft-lock
        working-directory: ./Sonic-Mania-Addendum/SonicMania/Objects/UFO
        run: |
          # SECONDGEMS_NONE == 0 -- the DEFAULT value in a fresh options file. Both
          # SpecialClear_State_ShowTotalScore_Continues and _NoContinues only branch on
          # SECONDGEMS_SUPEREMERALD (1) and SECONDGEMS_TIMESTONE (2), so with the default
          # the state machine never advances: permanent soft lock on the results screen
          # after every special stage, with no input that can escape it.
          sed -i 's@^        if (addendumOptions->secondaryGems == SECONDGEMS_SUPEREMERALD) {$@        if (addendumOptions->secondaryGems == SECONDGEMS_NONE) {\n            self->timer    = 0;\n            self->showFade = true;\n            RSDK.PlaySfx(SpecialClear->sfxSpecialWarp, false, 0xFF);\n            self->state    = SpecialClear_State_ExitResults;\n        }\n        else if (addendumOptions->secondaryGems == SECONDGEMS_SUPEREMERALD) {@' SpecialClear.c
          # Second hole in the same functions: SUPEREMERALD + all 7 emeralds +
          # specialStageID > 6 falls through an if with no else. The original block's
          # closing brace becomes the else's.
          sed -i 's@^                        self->state = SpecialClear_State_ExitFinishMessageSuper;$@&\n                    }\n                    else {\n                        self->timer    = 0;\n                        self->showFade = true;\n                        RSDK.PlaySfx(SpecialClear->sfxSpecialWarp, false, 0xFF);\n                        self->state    = SpecialClear_State_ExitResults;@' SpecialClear.c
          echo "--- patched states ---"
          sed -n '/^void SpecialClear_State_ShowTotalScore_Continues/,/^}$/p' SpecialClear.c
          test "$(grep -c 'secondaryGems == SECONDGEMS_NONE' SpecialClear.c)" -eq 2
          test "$(grep -c 'self->state    = SpecialClear_State_ExitResults;' SpecialClear.c)" -eq 4

      - name: Patch menu back gesture for touch-only devices
        working-directory: ./Sonic-Mania-Addendum/SonicMania/Objects/Menu
        run: |
          # Menus can only raise Back/Y through a UIButtonPrompt entity positioned
          # inside the control's bounds (UIControl_Create adopts prompts by position).
          # Several Addendum screens ship without one -- the Music submenu has no back
          # prompt at all -- leaving them inescapable on a touch-only device.
          # Global gesture fallback: 2-finger tap = Back, 3+-finger tap = Y.
          sed -i 's@^        UIControl->anyBackPress |= UIControl->forceBackPress;$@&\n\n        {\n            static int32 maxTouchCount = 0;\n            if (TouchInfo->count > maxTouchCount)\n                maxTouchCount = TouchInfo->count;\n            if (!TouchInfo->count \&\& maxTouchCount) {\n                if (maxTouchCount == 2)\n                    UIControl->anyBackPress = true;\n                else if (maxTouchCount >= 3)\n                    UIControl->anyYPress = true;\n                maxTouchCount = 0;\n            }\n        }@' UIControl.c
          echo "--- UIControl.c gesture block ---"
          grep -n -A13 'anyBackPress |= UIControl->forceBackPress' UIControl.c
          test "$(grep -c 'maxTouchCount' UIControl.c)" -eq 7

      - name: Patch sidekick selection for single-input devices
        working-directory: ./Sonic-Mania-Addendum/SonicMania/Objects/Menu
        run: |
          # UISaveSlot_NextCharacter_ExtraPlayers() already implements per-slot character
          # choice for players 2-4 and persists it to AddendumData, but it is only reachable
          # via ControllerInfo[CONT_P2..P4].keyY -- each extra player picking on their OWN
          # controller. A touch-only device has one input device, so it was unreachable.
          # A Y that did not come from a physical button (the multi-touch gesture from the
          # menu-gesture patch, or a tap on the SIDEKICK prompt) cycles player 2.
          # The press is consumed so one gesture advances exactly one step.
          sed -i 's@^                UISaveSlot_NextCharacter_ExtraPlayers(3);$@&\n\n            if (UIControl->anyYPress \&\& !ControllerInfo->keyY.press) {\n                UIControl->anyYPress = false;\n                UISaveSlot_NextCharacter_ExtraPlayers(1);\n            }@' UISaveSlot.c
          # Players 3/4 stay unreachable on a single device, so tie them to the sidekick:
          # cycling P2 round to "none" (7) clears them too. Inserted before the existing
          # persist block so its addendumData writes pick up the cleared values.
          sed -i 's@^    if (saveRAM->saveState != SAVEGAME_BLANK) {$@    if (playerID == 1 \&\& !self->p2Active) {\n        self->buddyFrameID1 = 7;\n        self->buddyFrameID2 = 7;\n        self->p3Active      = false;\n        self->p4Active      = false;\n    }\n\n&@' UISaveSlot.c
          echo "--- UISaveSlot.c wiring ---"
          grep -n -A4 'anyYPress \&\& !ControllerInfo->keyY.press' UISaveSlot.c
          echo "--- UISaveSlot.c cascade ---"
          grep -n -A6 'playerID == 1 \&\& !self->p2Active' UISaveSlot.c
          test "$(grep -c 'UIControl->anyYPress \&\& !ControllerInfo->keyY.press' UISaveSlot.c)" -eq 1
          test "$(grep -c 'UIControl->anyYPress = false;' UISaveSlot.c)" -eq 1
          test "$(grep -c 'playerID == 1 \&\& !self->p2Active' UISaveSlot.c)" -eq 1

      - name: Patch title screen logo corruption
        working-directory: ./Sonic-Mania-Addendum/SonicMania/Objects/Title
        run: |
          # Addendum's Data/Sprites/Title/PlusLogo.bin ships SIX animations:
          #   0 Plus Base | 1 Plus Shine | 2 Eggman | 3 Chain | 4 Capsule | 5 Smoke
          # TitleLogo_State_PlusLogo asks for animation "6 + reverseColor", which is out
          # of range, so RSDK::SetSpriteAnimation hits its `animationID >= spr->animCount`
          # guard and returns WITHOUT touching the animator. plusAnimator is therefore
          # never initialised, yet TitleLogo_State_PlusShine ProcessAnimation()s it and
          # TitleLogo_Draw draws it every frame -- corrupt blocks and drifting garbage,
          # beginning exactly when the logo bounce ends and the Plus states take over.
          # TitleLogo_State_PlusShine already contains the intended form: animation 1,
          # with reverseColor as the FRAME index. Mirror it.
          sed -i 's@^        RSDK.SetSpriteAnimation(TitleLogo->plusFrames, 6 + TitleLogo->reverseColor, \&self->plusAnimator, true, 0);$@        RSDK.SetSpriteAnimation(TitleLogo->plusFrames, 1, \&self->plusAnimator, true, TitleLogo->reverseColor);@' TitleLogo.c
          # Defensive: the PLUS entity never initialises its animators in Create, so a
          # draw before the first PlusLogo tick reads whatever the entity slot held.
          sed -i 's@^                    self->storeY = self->position.y;$@&\n                    RSDK.SetSpriteAnimation(TitleLogo->plusFrames, 0, \&self->plusUnderlayAnimator, true, 0);\n                    RSDK.SetSpriteAnimation(TitleLogo->plusFrames, 1, \&self->plusAnimator, true, 0);\n                    self->mainAnimator.frames = NULL;@' TitleLogo.c
          echo "--- TitleLogo_State_PlusLogo ---"
          awk '/^void TitleLogo_State_PlusLogo/,/^}$/' TitleLogo.c
          echo "--- Create, TITLELOGO_PLUS ---"
          grep -n -A5 'self->storeY = self->position.y;' TitleLogo.c
          test "$(grep -c '6 + TitleLogo->reverseColor' TitleLogo.c)" -eq 0
          test "$(grep -c 'plusFrames, 1, &self->plusAnimator, true, TitleLogo->reverseColor' TitleLogo.c)" -eq 2
          test "$(grep -c 'self->mainAnimator.frames = NULL;' TitleLogo.c)" -eq 1

      - name: Patch JNI local-ref leak in PrintLog
        working-directory: ./RSDKv5/RSDK/Dev
        run: |
          # RSDK::PrintLog on Android does:
          #   jbyteArray array = jni->env->NewByteArray(len);  // "gets freed automatically"
          #   ... CallVoidMethod(... writeLog, array, as);
          # It does NOT get freed automatically. JNI local refs are only reclaimed when a
          # native call RETURNS to Java; the engine's game loop never does, so every log
          # line leaks one local ref. Once the local reference table overflows the VM
          # aborts the process -- a hard crash with audio still running.
          # Sustained logging therefore kills the game; the Addendum Options screens hit
          # it fastest because they draw the most buttons.
          sed -i 's@^            jni->env->CallVoidMethod(jni->thiz, writeLog, array, as);$@&\n            jni->env->DeleteLocalRef(array);@' Debug.cpp
          echo "--- Debug.cpp ---"
          grep -n -A2 'CallVoidMethod(jni->thiz, writeLog' Debug.cpp
          test "$(grep -c 'DeleteLocalRef(array);' Debug.cpp)" -eq 1

      - name: Remove per-frame debug log from UIButton_Draw
        working-directory: ./Sonic-Mania-Addendum/SonicMania/Objects/Menu
        run: |
          # Leftover debug print inside UIButton_Draw, on the pre-rendered branch that
          # patch 1 routes essentially every button through. It fires once per button per
          # frame: ~33k lines for the Addendum Options list in a single session, each one
          # a JNI call. Even with the leak above fixed this is a large amount of I/O per
          # frame, so remove it at the source.
          sed -i '/drawing sprite %d from listID/d' UIButton.c
          echo "--- UIButton_Draw ---"
          grep -n -B2 -A2 'RSDK.DrawSprite(&self->animator, &drawPos, false);' UIButton.c
          test "$(grep -c 'drawing sprite' UIButton.c)" -eq 0

      - name: DIAGNOSTIC probes on Addendum Options exit path
        working-directory: ./Sonic-Mania-Addendum/SonicMania/Objects/Menu
        run: |
          # TEMPORARY. The Addendum Options exit still crashes after the JNI-leak and
          # debug-spam fixes, and log.txt stops at the menu tag print with no error --
          # a hard native crash. These probes bracket every call in
          # MainMenu_StartReturnToParentScreen so the last line written to log.txt
          # names the function that died. Remove once the culprit is known.
          # Safe to log here: fires once per menu exit, not per frame, and patch 12
          # fixed the JNI local-ref leak that made logging fatal.
          sed -i 's@^    if (MainMenu->inAddendumMenu) {$@    LogHelpers_Print("SRTP enter inAddendumMenu=%d", MainMenu->inAddendumMenu);\n\&@' MainMenu.c
          sed -i 's@^        AddendumToggles_\(.*\)();$@        LogHelpers_Print("SRTP >> \1");\n\&@' MainMenu.c
          sed -i 's@^        MainMenu->inAddendumMenu = false;$@        LogHelpers_Print("SRTP >> done");\n\&@' MainMenu.c
          sed -i 's@^bool32 MainMenu_AddendumSubMenu_ReturnToAddendumMenu(void) { @bool32 MainMenu_AddendumSubMenu_ReturnToAddendumMenu(void) { LogHelpers_Print("SRTP >> subBack"); @' MainMenu.c
          echo "--- instrumented ---"
          sed -n '/^void MainMenu_StartReturnToParentScreen/,/^}$/p' MainMenu.c
          test "$(grep -c 'SRTP >>' MainMenu.c)" -eq 11
          test "$(grep -c 'SRTP enter' MainMenu.c)" -eq 1

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Addendum + RSDKv5 Android
        working-directory: ./android
        run: |
          FLAGS=""
          if [ "${{ inputs.disable_plus }}" = "true" ]; then
            FLAGS="-PRETRO_DISABLE_PLUS"
          fi
          ./gradlew assemble --no-daemon \
            -PABIFILTERS="${{ inputs.abis }}" \
            $FLAGS \
            -PRETRO_REVISION=3 \
            --stacktrace
          mv app/build/outputs/apk/release/*.apk addendum_mania.apk

      - name: Bundle APK & mods
        run: |
          mkdir -p artifacts/mods
          cp android/*.apk artifacts/
          mkdir -p artifacts/mods/MTC
          cp -r android/app/jni/MTC/build/* artifacts/mods/MTC || true
          mkdir -p artifacts/mods/UWM
          cp -r android/app/jni/UWM/build/* artifacts/mods/UWM || true
          mkdir -p artifacts/mods/GLShaders/Data/Shaders
          cp -r RSDKv5/Shaders/OGL artifacts/mods/GLShaders/Data/Shaders
          printf "Name=GLShaders\nDescription=OGLShaders\nAuthor=Ducky\nVersion=1.0.0\nTargetVersion=-1\n" > artifacts/mods/GLShaders/mod.ini

      - name: Cleanup symlink
        if: always()
        run: rm -f "$PWD/Sonic-Mania-Addendum/dependencies/RSDKv5"

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: addendum-android
          path: artifacts
